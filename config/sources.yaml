# Signal - 信息源配置
# 每个源可以配置主方式和备用方式

sources:
  # ============================================
  # 学术论文（最稳定）
  # ============================================

  - name: "arXiv (AI+LG+CL)"
    id: "arxiv_all"
    priority: 1
    enabled: true
    collectors:
      - type: api
        api_type: arxiv
        params:
          category: "cat:cs.AI+OR+cat:cs.LG+OR+cat:cs.CL"
          max_results: 50
        timeout: 60

  - name: "arXiv (CV+RO)"
    id: "arxiv_cv_ro"
    priority: 1
    enabled: true
    collectors:
      - type: api
        api_type: arxiv
        params:
          category: "cs.CV+OR+cat:cs.RO"
          max_results: 30
        timeout: 60

  - name: "Hugging Face Daily Papers"
    id: "hf_daily"
    priority: 1
    enabled: true
    collectors:
      - type: api
        api_type: huggingface
        params:
          max_results: 20
        timeout: 30

  # ============================================
  # 科技媒体（使用稳定 RSS）
  # ============================================

  - name: "量子位"
    id: "liangziwei"
    priority: 1
    enabled: true
    collectors:
      - type: rss
        url: "https://www.qbitai.com/feed"
        timeout: 30

  - name: "机器之心"
    id: "jiqizhixin"
    priority: 1
    enabled: true
    collectors:
      - type: rss
        url: "https://www.jiqizhixin.com/rss"
        timeout: 30

  - name: "36氪 - AI"
    id: "36kr_ai"
    priority: 2
    enabled: true
    collectors:
      - type: rss
        url: "https://36kr.com/feed"
        timeout: 30
      - type: rss
        url: "https://rsshub.app/36kr/motif/ai"
        timeout: 30

  - name: "TechCrunch AI"
    id: "techcrunch_ai"
    priority: 2
    enabled: true
    collectors:
      - type: rss
        url: "https://techcrunch.com/category/artificial-intelligence/feed"
        timeout: 30

  - name: "Reddit MachineLearning"
    id: "reddit_ml"
    priority: 3
    enabled: true
    collectors:
      - type: rss
        url: "https://www.reddit.com/r/MachineLearning/.rss"
        timeout: 30

  # ============================================
  # 开源项目（可选）
  # ============================================

  - name: "GitHub Trending AI"
    id: "github_trending"
    priority: 3
    enabled: false
    collectors:
      - type: web
        url: "https://github.com/trending?since=daily"
        timeout: 30

  # ============================================
  # 社媒一手源（一级热源：快、带话题、带热度信号；tier:1）
  # 免费、无登录源优先；凭证类源（twitter/youtube/bilibili/xiaohongshu）留作
  # 凭证就绪后的可插拔桩，无对应 env 时 SocialCollector 安全跳过。
  # ============================================

  - name: "Hacker News (AI)"
    id: "hn_ai"
    priority: 1
    enabled: true
    tier: 1
    collectors:
      - type: social
        social_type: hackernews
        params:
          query: "AI OR LLM OR machine learning OR deep learning"
          max_results: 20

  - name: "GitHub (AI repos)"
    id: "gh_ai_social"
    priority: 1
    enabled: true
    tier: 1
    collectors:
      - type: social
        social_type: github
        params:
          topic: "llm"
          max_results: 15

  - name: "Reddit r/MachineLearning"
    id: "reddit_ml_social"
    priority: 2
    enabled: false  # disabled: duplicates RSS source (reddit_ml)
    tier: 1
    collectors:
      - type: social
        social_type: reddit
        params:
          subreddit: "MachineLearning"
          max_results: 15
