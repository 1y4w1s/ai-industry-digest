<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 菱形网：3条斜线交织，象征「从信息海中打捞干货」 -->
  <!-- 也抽象为 "K" 字母（乾） -->
  <path d="M4 4 L16 16 L28 4" stroke="#C8922A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M4 16 L16 28 L28 16" stroke="#C8922A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 4 L4 16 L16 28" stroke="#C8922A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 4 L28 16 L16 28" stroke="#C8922A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 金色圆点 = 干货/金粒，悬浮于网中央 -->
  <circle cx="16" cy="16" r="4" fill="#C8922A"/>
  <circle cx="16" cy="16" r="2.5" fill="#F5E6B0"/>
</svg>
