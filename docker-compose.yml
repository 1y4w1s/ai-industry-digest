# Signal API — 本地 / 单机部署
# 用法：docker compose up -d --build
# 前端 dist 由 CI 构建后挂载（同 prod 架构），或本地 `npm run build` 后挂载
services:
  redis:
    image: redis:7-alpine
    container_name: signal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  signal-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: signal-api:latest
    container_name: signal-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      # 前端构建产物（CI 同步或本地 build 后挂载）
      - ./frontend/dist:/app/frontend/dist:ro
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis_data:
